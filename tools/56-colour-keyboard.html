ong red square across the whole loop. Squares hold and loop the sound, so it becomes a bed you can chop with black points.", "Ask Gemini for 'Composition VIII, but at 3am in the rain', then shift-click away half of what it paints and see what's left."], "manifesto": {"name": "Concerning the Spiritual in Art", "short": "Kandinsky: Spiritual in Art", "author": "Wassily Kandinsky (1866 to 1944)", "year": "1911", "where": "Über das Geistige in der Kunst, Munich, December 1911 (dated 1912). English translation by Michael T. H. Sadler (Sadleir), 1914. Followed by Point and Line to Plane (Bauhaus book, 1926).", "ideas": ["Art should express 'inner necessity', the inner sound of forms and colours, not copy the look of things.", "Colours have sounds. Yellow is a shrill trumpet. Light blue is a flute, darker blue a cello, darker still a double bass, and the darkest blue an organ. Green is the placid middle notes of a violin. Orange is the Angelus bell or an old violin. Violet is a cor anglais or a bassoon.", "Forms have sounds too. Acute shapes such as the triangle go with sharp colours such as yellow, and deep round shapes such as the circle go with blue. In his Bauhaus questionnaire of 1923 he asked students to pair the yellow triangle, the red square and the blue circle.", "White is a silence full of possibility, like a pause in music. Black is the silence of death.", "Point and Line to Plane (1926): the point is the smallest element and the line is a point set in motion. Here, points pluck and lines glide."], "quotes": [["Colour is the keyboard, the eyes are the hammers, the soul is the piano with many strings. The artist is the hand which plays, touching one key or another, to cause vibrations in the soul.", "Wassily Kandinsky, Concerning the Spiritual in Art, 1911 (trans. Sadler)"], ["Keen lemon-yellow hurts the eye in time as a prolonged and shrill trumpet-note the ear", "Kandinsky, 1911"], ["White, therefore, has this harmony of silence, which works upon us negatively, like many pauses in music that break temporarily the melody.", "Kandinsky, 1911"], ["The silence of black is the silence of death.", "Kandinsky, 1911"]], "system": "The canvas is a score. Each shape has a colour, a shape, x (when), y (pitch), size (level and length) and rotation (stereo). Colour picks the slot, Kandinsky's instrument. Shape picks the articulation: a point plucks, a line glides from its start pitch to its end pitch, a triangle is sharp and an octave up, a square holds and loops the sound, and a circle swells in an octave down with more reverb. White ducks the whole mix for a pause, and black stops every sound that is playing. In RADIAL mode the bar sweeps like a clock hand from the centre."}, "design": {"name": "Paul Rand", "short": "Paul Rand", "who": "Paul Rand (1914 to 1996), American graphic designer, author of Thoughts on Design (1947), designer of the IBM, Westinghouse, ABC and UPS identities, and teacher at Yale", "era": "New York and Connecticut, 1930s to 1996", "hallmarks": ["Playful, simple geometry: cut-paper shapes with a hand-made edge, a little crooked, never mechanical", "Flat primary colours and lots of white space, often with handwriting next to clean type", "Wit and visual puns, like the rebus in the Eye-Bee-M poster (1981)"], "works": ["IBM striped logo (1972)", "Westinghouse (1960) and ABC (1962) logos", "Sparkle and Spin, a children's book with Ann Rand (1957)"]}, "no": "56", "slug": "colour-keyboard", "file": "tools/56-colour-keyboard.html"};</script>

function pick(i) { st.col = i; MM.$$('#pal .sw').forEach((b, j) => b.classList.toggle('on', j === i)); }
function pickShape(s) { st.shape = s; MM.$$('#pal .sh').forEach((b) => b.classList.toggle('on', b.dataset.s === s)); }
function undo() { if (hist.length) shapes = JSON.parse(hist.pop()); }
// built-in instruments, all at C4 so that pitch maths is shared
function mk(name, len, fn) { const ctx = MM.ctx, sr = ctx.sampleRate, B = ctx.createBuffer(1, (sr * len) | 0, sr), d = B.getChannelData(0); let pk = 0; for (let i = 0; i < d.length; i++) { d[i] = fn(i / sr); pk = Math.max(pk, Math.abs(d[i])); } for (let i = 0; i < d.length; i++) d[i] *= 0.7 / (pk || 1); MM.fb[name] = B; }
function mkFallbacks() { const f = MM.mtof(60), TAU = 6.2832, add = (t, n, roll, vib = 0) => { let s = 0; const ff = f * (1 + vib * Math.sin(t * TAU * 5.3)); for (let h = 1; h <= n; h++) s += Math.sin(TAU * ff * h * t) * Math.pow(h, -roll); return s; };
  mk('k_yel', 1.6, (t) => add(t, 14, 0.9 - Math.min(0.5, t * 2), 0.004) * Math.min(1, t * 30) * Math.exp(-t * 0.8));
  mk('k_red', 1.4, (t) => add(t / 2, 6, 1.4) * Math.min(1, t * 40) * Math.exp(-t * 1.5) + Math.sin(TAU * 60 * t * (1 + Math.exp(-t * 30))) * Math.exp(-t * 9) * 1.5);
  mk('k_blu', 2.2, (t) => add(t, 10, 1.25, 0.006) * Math.min(1, t * 6) * Math.exp(-t * 0.4));
  mk('k_grn', 2.0, (t) => add(t, 12, 1.0, 0.008) * Math.min(1, t * 8) * Math.exp(-t * 0.5));
  mk('k_orn', 3.0, (t) => [1, 2.4, 2.98, 4.2, 5.4].reduce((s, r, k) => s + Math.sin(TAU * f * r * t) * Math.exp(-t * (0.8 + k * 0.9)) / (k + 1), 0) * Math.min(1, t * 400));
  mk('k_vio', 1.8, (t) => { let s = 0; for (let h = 1; h <= 11; h += 2) s += Math.sin(TAU * f * h * t * (1 + 0.004 * Math.sin(t * 30))) / h; return s * Math.min(1, t * 15) * Math.exp(-t * 0.6); }); }
