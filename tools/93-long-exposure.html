ed pattern takes a very long time to repeat, so the piece feels alive without being random."], "quotes": [], "system": "Each cloud schedules grains at a density that rises with exposure (about 4 to 44 per second), with a length of about 40 to 700 milliseconds, a Hann-like fade in and out, a read position that scans slowly through the trimmed region of its sample and a random jitter set by position blur. Each grain's pitch is one note of the current chord stack, shifted into the cloud's register, with a tiny random detune. The chord's root walks around the chosen scale every harmony-drift period, ringing the pad. Each cloud's level follows its own slow cycle (47, 61 and 89 seconds) scaled by breathing. A frame stores the three read positions, the chord root and stack, the exposure and the scan speed; recall glides the clouds to the stored positions and rings the bell.", "dubious": "Granular synthesis and tape-based techniques are general studio methods with many contributors; this tool presents a simple version in its own words and takes nothing from any recording."}, "design": {"name": "The photographic contact sheet and film-edge markings (darkroom proofs, 1930s to 1990s)", "short": "Contact sheet", "who": "Darkroom photographers and film manufacturers", "era": "1930s to 1990s", "hallmarks": ["A dark sheet of film strips, each a row of small frames separated by thin gaps, with rows of sprocket holes along both edges.", "Small frame numbers and arrow marks printed along the film edge in warm amber, and a red grease-pencil circle round the frames chosen for printing.", "A restricted palette of near-black, cream paper tones and warm amber, and a plain typewriter or monospaced type."], "works": ["Look up photographers' contact sheets with grease-pencil selections", "Look up the film-edge markings found on 35mm film strips", "Search 'contact sheet' in museum photography archives"]}, "no": "93", "slug": "long-exposure", "file": "tools/93-long-exposure.html"};</script>
