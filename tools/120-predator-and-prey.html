function mkVellum(W,H){const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.fillStyle='#efe3c4';g.fillRect(0,0,W,H);for(let k=0;k<160;k++){const x=R()*W,y=R()*H,r=20+R()*90,gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(${R()<0.5?'170,140,90':'255,250,230'},${0.05+R()*0.06})`);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r);}return c;}
function draw(){cv.fit();const g=cv.g,W=cv.w,H=cv.h,vj=MMX.vjOn,lv=MMX.level();level+=(lv.rms-level)*0.2;lastCatch*=0.9;
  if(!vellum||vellum.width!==Math.round(W)||vellum.height!==Math.round(H))vellum=mkVellum(Math.round(W),Math.round(H));g.drawImage(vellum,0,0,W,H);if(vj){g.fillStyle='rgba(20,14,8,.55)';g.fillRect(0,0,W,H);}
  const INK=vj?'#f1e4c2':'#2b2117',GOLD='#b08d3c',BLUE='#2a4b8d',RED='#b3261e',GREEN=vj?'#9fc08a':'#3d5a2a',m=Math.max(14,W*0.025);
  g.strokeStyle=GOLD;g.lineWidth=3;g.strokeRect(m,m,W-2*m,H-2*m);g.lineWidth=1;g.strokeStyle=INK;g.strokeRect(m+6,m+6,W-2*m-12,H-2*m-12);
  const colW=(W-2*m-36)/2,lx=m+18,rx=lx+colW+18,top=m+20;
  // heading and initial
  g.fillStyle=INK;g.textAlign='left';g.font=`400 ${Math.min(34,W*0.035)}px 'UnifrakturMaguntia'`;g.fillText('De lepore et lynce',lx,top+28);
  const isz=Math.min(86,colW*0.26),iy=top+44;g.fillStyle=BLUE;g.fillRect(lx,iy,isz,isz);g.strokeStyle=GOLD;g.lineWidth=3;g.strokeRect(lx+3,iy+3,isz-6,isz-6);g.fillStyle=GOLD;g.font=`400 ${isz*0.82}px 'UnifrakturMaguntia'`;g.textAlign='center';g.fillText('W',lx+isz/2,iy+isz*0.78);
  g.fillStyle=INK;g.textAlign='left';const fs=Math.max(12,Math.min(17,colW*0.045));g.font=`400 ${fs}px 'IM Fell English'`;
  const text=['hen the hares are many, the lynx grow fat','and many. When the lynx are many, the hares','grow few. When the hares are few, the lynx','go hungry and grow few, and then the hares','return. So the two turn about each other','and the wheel does not rest.'];
  text.forEach((l,k)=>g.fillText(l,k<3?lx+isz+8:lx,k<3?iy+fs*1.1+k*fs*1.35:iy+isz+fs*1.1+(k-3)*fs*1.35));
  // the chronicle: populations across the years (prey in green ink, lynx in the one red)
  const cy0=iy+isz+fs*6.4,chH=Math.max(60,H-cy0-m-60);g.font=`italic 400 ${fs}px 'IM Fell English'`;g.fillText('The chronicle of the years',lx,cy0-6);g.strokeStyle=INK;g.lineWidth=1;g.beginPath();g.moveTo(lx,cy0+chH);g.lineTo(lx+colW,cy0+chH);g.stroke();
  const mx=Math.max(1.5,...hist.map(p=>Math.max(p[0],p[1])));[[0,GREEN],[1,RED]].forEach(([k,col])=>{g.strokeStyle=col;g.lineWidth=2;g.beginPath();hist.forEach((p,j)=>{const X=lx+j/219*colW,Y=cy0+chH-p[k]/mx*chH*0.95;j?g.lineTo(X,Y):g.moveTo(X,Y);});g.stroke();});
  g.fillStyle=INK;g.font=`400 ${fs*0.9}px 'IM Fell English'`;g.fillText('hares',lx+4,cy0+chH+fs*1.2);g.fillStyle=RED;g.fillText('lynx',lx+54,cy0+chH+fs*1.2);g.fillStyle=INK;g.textAlign='right';g.fillText('Anno '+roman(years+1),lx+colW,cy0+chH+fs*1.2);
  // the roundel: the cycle of hare against lynx
  const r=Math.min(colW*0.42,(H-2*m)*0.3)*(vj?1.25:1),cx=vj?W/2:rx+colW/2,cyR=vj?H/2:top+r+40,sc=Math.max(1.5,mx*1.15);geo={cx,cy:cyR,r,sc};
  g.fillStyle=vj?'rgba(40,30,16,.6)':'rgba(255,250,235,.55)';g.beginPath();g.arc(cx,cyR,r,0,TAU);g.fill();g.strokeStyle=GOLD;g.lineWidth=6;g.stroke();g.strokeStyle=BLUE;g.lineWidth=2;g.beginPath();g.arc(cx,cyR,r+7,0,TAU);g.stroke();
  for(let k=0;k<24;k++){const a=k/24*TAU;g.fillStyle=k%2?BLUE:GOLD;g.beginPath();g.arc(cx+Math.cos(a)*(r+15),cyR+Math.sin(a)*(r+15),3,0,TAU);g.fill();}
  const toXY=(x,y)=>[cx-r+x/sc*2*r,cyR+r-y/sc*2*r];g.save();g.beginPath();g.arc(cx,cyR,r-3,0,TAU);g.clip();
  const E=eq(),[ex,ey]=toXY(E.x,E.y);g.strokeStyle=INK;g.globalAlpha=0.4;g.setLineDash([2,4]);g.beginPath();g.moveTo(ex,cyR-r);g.lineTo(ex,cyR+r);g.moveTo(cx-r,ey);g.lineTo(cx+r,ey);g.stroke();g.setLineDash([]);g.globalAlpha=1;
  g.strokeStyle=INK;g.lineWidth=1.5;g.beginPath();trail.forEach((p,j)=>{const [X,Y]=toXY(p[0],p[1]);j?g.lineTo(X,Y):g.moveTo(X,Y);});g.stroke();
  const [px,py]=toXY(P.x,P.y);g.fillStyle=GOLD;g.beginPath();g.arc(px,py,6+level*24+lastCatch*6,0,TAU);g.fill();g.strokeStyle=INK;g.lineWidth=1.5;g.stroke();
  g.fillStyle=INK;g.font=`italic 400 ${fs*0.85}px 'IM Fell English'`;g.textAlign='center';g.fillText('balance',ex,ey-6);g.restore();
  g.fillStyle=INK;g.font=`italic 400 ${fs*0.9}px 'IM Fell English'`;g.textAlign='center';g.fillText('more hares →',cx,cyR+r+34);g.save();g.translate(cx-r-28,cyR);g.rotate(-Math.PI/2);g.fillText('more lynx →',0,0);g.restore();
  // marginalia: the creatures themselves, as many as there are
  const nH=Math.min(40,Math.round(P.x*7)),nL=Math.min(30,Math.round(P.y*7)),bandY=vj?H-m-40:cyR+r+58,bx0=vj?m+30:rx,bw=vj?W-2*m-60:colW;
  for(let k=0;k<nH;k++){const x=bx0+(k%20)/20*bw+8,y=bandY+Math.floor(k/20)*24+Math.sin(k*1.7+years*3)*2;hareG(g,x,y,6,vj?'#d9c08a':'#8a6a3a');}
  for(let k=0;k<nL;k++){const x=bx0+(k%15)/15*bw+12,y=bandY+52+Math.floor(k/15)*26;lynxG(g,x,y,7,vj?'#e0b070':'#5a3b1f');}}
const mk=(len,fn)=>{const c=MM.ctx,sr=c.sampleRate,b=c.createBuffer(1,(sr*len)|0,sr),d=b.getChannelData(0);let pk=0;for(let i=0;i<d.length;i++){d[i]=fn(i/sr);pk=Math.max(pk,Math.abs(d[i]));}for(let i=0;i<d.length;i++)d[i]*=0.8/(pk||1);return b;};
const C4=261.63,C3=130.81;
const FBS={hare:()=>mk(0.6,t=>{let v=0;for(let h=1;h<6;h++)v+=Math.sin(TAU*C4*h*t)*Math.exp(-t*(8+h*5))/h;return v*Math.min(1,t*900);}),
  rustle:()=>{let lp=0;return mk(0.25,t=>{lp+=0.35*((R()*2-1)-lp);return lp*Math.sin(Math.PI*t/0.25)**2;});},
  lynx:()=>mk(3,t=>{const v=Math.sin(TAU*C3*t+0.8*Math.sin(TAU*C3*t))+0.4*Math.sin(TAU*C3*2*t);return v*Math.min(1,t*6)*Math.exp(-t*0.7)*(1+0.1*Math.sin(TAU*5*t));}),
  catch:()=>mk(0.35,t=>(R()*2-1)*Math.exp(-t*40)*0.8+Math.sin(TAU*(90*t+40*(1-Math.exp(-t*20))/20))*Math.exp(-t*12)),
  ground:()=>mk(8,t=>(Math.sin(TAU*C3*t)+0.5*Math.sin(TAU*C3*1.5*t+Math.sin(TAU*0.07*t))+0.25*Math.sin(TAU*C3*2*t))*Math.min(1,t/2)*Math.min(1,(8-t)/2)),
  bell:()=>mk(3,t=>[1,2.4,4.1,5.43].reduce((s,h,j)=>s+Math.sin(TAU*C4*h*t)*Math.exp(-t*(0.9+j*1.3))/(j+1),0)*Math.min(1,t*600))};
const cfg={bpm:100,div:4,swing:0,step,draw,start:()=>{},stop:()=>{},
  onSamples:list=>{MMX.assign(list);MMX.fire(0,MM.now+0.02,{maxDur:2,dest:N.mix});},
  key:e=>{if(MMX.key(e))return;const k=e.key.toLowerCase();if(k==='h')setPop(P.x*1.6+0.2,P.y,'Hares released');else if(k==='y')setPop(P.x,P.y*1.6+0.2,'Lynx released');else if(k==='t')setPop(P.x,P.y*0.4,'Traps set: the lynx are thinned');else if(k==='b'){const E=eq();setPop(E.x,E.y,'The balance point: nothing changes');}},
  setup(){MM.ensure();const c=MM.ctx;N.mix=c.createGain();N.mix.connect(MM.out);Object.entries(FBS).forEach(([k,f])=>MM.fb[k]=f());cv=MM.canvas('#cv');
    MMX.init({state:st,slots:[['Hare voice (pitched)','hare'],['Hare rustle','rustle'],['Lynx voice (low, pitched)','lynx'],['The catch','catch'],['Ground drone','ground'],['Season bell','bell']].map(([label,kind],i)=>({label,kind,rv:[0.2,0.1,0.3,0.15,0.3,0.4][i],gain:0.9})),
      onSlot:i=>{if(!MM.playing)MMX.fire(i,MM.now+0.02,{maxDur:2,dest:N.mix});},onTrim:()=>{},onPreset:()=>{},
      factory:fac(),extra:{get:()=>({x:P.x,y:P.y}),set:x=>{if(x&&Number.isFinite(x.x)&&Number.isFinite(x.y)){P.x=x.x;P.y=x.y;trail=[];}}},
      keys:[['H','release hares'],['Y','release lynx'],['T','set traps (fewer lynx)'],['B','jump to the balance point'],['click','set hares and lynx in the roundel']],
      midiHelp:'Notes below middle C release lynx, notes from middle C up release hares (velocity sets how many). CC 1 years per bar, CC 2 hunting rate.',midi:(n,v,on)=>{if(!on)return;if(n<60)setPop(P.x,P.y*(1+v)+0.1,'Lynx released');else setPop(P.x*(1+v)+0.1,P.y,'Hares released');}});
    MMX.vj('#view');const C=[0,1,2,3].map(k=>MM.$('#c'+k));
    MMX.ctl(C[0],'birth',{label:'Hare births',min:0.2,max:2});MMX.ctl(C[0],'hunt',{label:'Hunting',min:0.2,max:2,cc:2});MMX.ctl(C[0],'feed',{label:'Lynx feeding',min:0.2,max:2});MMX.ctl(C[0],'death',{label:'Lynx deaths',min:0.2,max:2});
    MMX.ctl(C[1],'grass',{label:'Grass limit',min:0,max:1});MMX.ctl(C[1],'speed',{label:'Years a bar',min:0.05,max:1.5,cc:1});MMX.ctl(C[1],'weather',{label:'Weather',min:0,max:1});
    MMX.ctl(C[2],'key',{type:'select',label:'Key',options:NM.map((n,j)=>[j,n])});MMX.ctl(C[2],'scale',{type:'select',label:'Scale',options:[['dorian','Dorian'],['minor','Minor'],['major','Major'],['lydian','Lydian'],['penta','Pentatonic']]});
    MMX.ctl(C[3],'hare',{label:'Hares',min:0,max:1.5});MMX.ctl(C[3],'rustle',{label:'Rustle',min:0,max:1.5});MMX.ctl(C[3],'lynx',{label:'Lynx',min:0,max:1.5});MMX.ctl(C[3],'catch',{label:'Catches',min:0,max:1.5});MMX.ctl(C[3],'drone',{label:'Ground',min:0,max:1.5});MMX.ctl(C[3],'bell',{label:'Season bell',min:0,max:1.5});MMX.ctl(C[3],'rev',{label:'Reverb',min:0,max:1});MMX.ctl(C[3],'lv',{label:'Level',min:0,max:1.5});
    MM.drag(MM.$('#cv'),hit);MM.$('#b-h').onclick=()=>setPop(P.x*1.6+0.2,P.y,'Hares released');MM.$('#b-y').onclick=()=>setPop(P.x,P.y*1.6+0.2,'Lynx released');MM.$('#b-t').onclick=()=>setPop(P.x,P.y*0.4,'Traps set: the lynx are thinned');MM.$('#b-b').onclick=()=>{const E=eq();setPop(E.x,E.y,'The balance point: nothing changes');};}};
function fac(){const b0=JSON.parse(JSON.stringify(st)),P0=o=>({full:{params:Object.assign({},b0,o),extra:null}});
  return{'The long wheel (default)':{},'Fast seasons':P0({speed:1.2,birth:1.4,death:1.1}),'Settling to balance':P0({grass:0.55,speed:0.8}),'Hungry lynx':P0({feed:0.4,death:0.5,hunt:1.4,scale:'minor'}),'Wild weather':P0({weather:0.8,speed:0.7,scale:'penta'})};}
