      system: 'You write short, original prompt cards for a generative tape-loop music machine. Each card is a plain-English suggestion of at most 12 words that a musician could act on while listening. Never quote, copy or imitate any published card deck, book, lyric or text, and never mention any person. Reply with JSON only.',
      schema: { type: 'OBJECT', properties: { cards: { type: 'ARRAY', items: { type: 'OBJECT', properties: { text: { type: 'STRING' }, action: { type: 'STRING' } }, required: ['text', 'action'] } } }, required: ['cards'] },
      user: (p) => `Mood: ${p}\nWrite six cards. For each give one action from: ${ACTIONS.join(', ')}, or none.`,
      apply: (r) => { const add = (r.cards || []).slice(0, 12).map((c) => String(c.text || '').replace(/[\[\]\n]/g, '').slice(0, 90) + (ACTIONS.includes(String(c.action).toLowerCase()) ? ' [' + String(c.action).toLowerCase() + ']' : '')).filter((x) => x.trim()); addCards(add); return `Added ${add.length} cards.`; },
      fallback: (p) => { const w = (p || 'quiet').split(/\s+/).filter((x) => x.length > 3).slice(0, 6); const T = ['Let the {w} set the pace [slower]', 'Plant one note for the {w} [plant]', 'Thin it out until only the {w} is left [thin]', 'Hear the {w} from far away [ignore]', 'Follow the {w} closely [listen]', 'Give the {w} a long echo [echo]']; addCards(T.map((t, k) => t.replace('{w}', w[k % (w.length || 1)] || 'quiet'))); } });
    MM.$('#b-o').onclick = () => drawCard(); MM.$('#b-l').onclick = () => cfg.key({ key: 'c' }); MM.$('#b-i').onclick = () => cfg.key({ key: 'b' }); MM.$('#b-g').onclick = () => cfg.key({ key: 'g' }); MM.$('#b-n').onclick = () => cfg.key({ key: 'n' }); MM.$('#b-p').onclick = () => cfg.key({ key: 'p' }); MM.$('#b-r').onclick = () => cfg.key({ key: 'a' });
    MM.drag(MM.$('#cv'), (x, y, ph) => { if (faderRect && (ph === 'down' ? y >= faderRect.y - 8 && y <= faderRect.y + faderRect.h + 8 && x >= faderRect.x - 10 && x <= faderRect.x + faderRect.w + 10 : faderRect.drag)) { faderRect.drag = ph !== 'up'; MMX.setParam('attention', MM.clamp((x - faderRect.x) / faderRect.w, 0, 1)); return; } if (ph !== 'down') return; reelRects.forEach((r, i) => { if (Math.hypot(x - r.cx, y - r.cy) < r.R * 1.15) { plant(i); if (!MM.playing) MMX.fire(i, MM.now + 0.02, { maxDur: 2.5 }); } }); });
    renderBtns(); mix(); } };
function addCards(list) { if (!list.length) return; cardsText = (cardsText.trim() + '\n' + list.join('\n')).trim(); MM.$('#cards').value = cardsText; drawCard(list[0]); }
function renderBtns() { MM.$('#b-g').classList.toggle('on', !!st.garden); MM.$('#b-l').classList.toggle('on', st.attention >= 0.7); MM.$('#b-i').classList.toggle('on', st.attention <= 0.25); }
function fac() { const base = JSON.parse(JSON.stringify(st)), Pp = (o) => ({ full: { params: Object.assign({}, base, o) } });
  return { 'Return time (default)': {}, 'Background, barely there': Pp({ attention: 0.1, wear: 0.02, echo: 0.5, sat: 0.15, wow: 0.15, density: 0.3 }), 'Lean in: listening': Pp({ attention: 0.95, density: 0.9, echo: 0.25, scale: 'lydian', root: 2 }), 'Worn tape, quick garden': Pp({ wear: 0.15, gRate: 1, wow: 0.7, sat: 0.6, scale: 'dorian' }), 'Half-speed afternoon': Pp({ speed: 0.5, echo: 0.6, scale: 'minpent', root: 9, cardEvery: 2 }), 'Nearly related loops (short return)': Pp({ L0: 16, L1: 20, L2: 24, L3: 32, sp4: 1, sp5: 1, seed: 7 }) }; }
MM.init(cfg);
