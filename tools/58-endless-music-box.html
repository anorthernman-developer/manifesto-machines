e), a pan (left to right) and a sound (by height, or the one you pick). The note plays at once and then again every CYCLE seconds, losing a little level each time (DECAY) until it disappears. FREEZE stops the fading. DRIFT lets each repeat wander to a neighbouring note, so a phrase slowly changes. With TWO CYCLES, the right half of the field runs on a different, out-of-step cycle, like the unsynchronised loops of Music for Airports. If you stop for longer than the IDLE time, EVOLVE plays the box itself with a slow random walk. Behind it, a drone holds the key, and the PAINTING layer recombines coloured fields and swells a texture each time, after 77 Million Paintings. Moods here are our own, not Bloom's twelve."}, "design": {"name": "Vaughan Oliver and v23 (4AD)", "short": "Vaughan Oliver / v23", "who": "Vaughan Oliver (1957 to 2019), British designer for the record label 4AD, working as 23 Envelope with the photographer Nigel Grierson and later as v23 with Chris Bigg", "era": "London, 1981 to the 2010s", "hallmarks": ["Atmosphere before information: blurred, close-up, often unidentifiable photography and textures that set a mood. Here the field is dark, grainy and soft-focus.", "Elegant type used sparingly and very small, set against huge empty space, with serif italics and widely spaced capitals. Here the captions sit in the corners and run up the side.", "Layering: transparent images, scratches and light leaks stacked over each other, so the cover rewards a long look, like ambient music. Here the painting layers stack and slowly change."], "works": ["Cocteau Twins, 'Treasure' (1984)", "This Mortal Coil, 'It'll End in Tears' (1984)", "Pixies, 'Doolittle' (1989); and Rick Poynor's book 'Vaughan Oliver: Visceral Pleasures' (2000)"]}, "no": "58", "slug": "endless-music-box", "file": "tools/58-endless-music-box.html"};</script>
