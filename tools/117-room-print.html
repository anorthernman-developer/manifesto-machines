const mk=(len,fn,ch=1)=>{const c=MM.ctx,sr=c.sampleRate,b=c.createBuffer(ch,(sr*len)|0,sr);let pk=0;for(let q=0;q<ch;q++){const d=b.getChannelData(q);for(let i=0;i<d.length;i++){d[i]=fn(i/sr,q);pk=Math.max(pk,Math.abs(d[i]));}}for(let q=0;q<ch;q++){const d=b.getChannelData(q);for(let i=0;i<d.length;i++)d[i]*=0.8/(pk||1);}return b;};

  field:()=>{let lp=0;return mk(7,t=>{lp+=0.03*((R()*2-1)-lp);const chirp=(t%1.7)<0.12?Math.sin(TAU*(3200+2000*((t%1.7)/0.12))*t)*0.15:0;return lp*2.5+chirp+0.05*Math.sin(TAU*90*t);});},
