ontrast (black and white, figure and ground) is the engine of the work: invert it and you get a new work of equal weight."], "quotes": [], "system": "The grid is 16 columns (16ths) by 8 rows (scale degrees, low at the bottom). Each unit has an inner form and a colour. Colour picks the slot (with its own octave); form picks the articulation: circle a note one step long, square a short note, rhombus the note plus an octave-up grace note, tall ellipse a note four steps long, wide ellipse two quick repeats, dot a quiet ghost note. The Vega bulge is a circular lens moving on a slow Lissajous path; units inside it are drawn larger and play louder, longer and with the filter fully open; outside, the filter closes a little. Negative mode plays every empty unit next to a filled one (the outline of the empty space), as dots, in the colour of its neighbour. The programme picks one transformation every N bars: permute colours, retrograde, mirror, shift by one step, or multiply."}, "design": {"name": "Franco Grignani", "short": "Grignani", "who": "Franco Grignani (1908 to 1999), Italian graphic designer, painter and photographer, who explored optical illusion and perceptual distortion in advertising and art", "era": "Milan, 1930s to 1990s; best known for 1950s to 1960s work", "hallmarks": ["Black and white lines and grids bent, swollen and twisted until they appear to move: optical distortion as the message.", "Type distorted in the same way, stretched, squeezed or seen through a lens, so lettering becomes part of the illusion.", "Systematic experiments: one structure varied step by step (his 'Psicoplastica' and 'Dissociazioni' series), close to Op Art but rooted in perception studies.", "Spare, high-contrast advertising pages where a single optical idea carries the brand."], "works": ["Advertisements for the printer Alfieri & Lacroix (1950s to 1960s)", "Covers and pages for the magazine 'Pubblicità in Italia'", "The Woolmark logo (1964), entered under the name Francesco Saroglia and widely attributed to Grignani"]}, "no": "66", "slug": "plastic-unit", "file": "tools/66-plastic-unit.html"};</script>

/* built-in sounds, tuned to C4 */
function mkB(len, fn) { const c = MM.ctx, sr = c.sampleRate, B = c.createBuffer(1, (sr * len) | 0, sr), d = B.getChannelData(0); let pk = 0; for (let i = 0; i < d.length; i++) { d[i] = fn(i / sr); pk = Math.max(pk, Math.abs(d[i])); } for (let i = 0; i < d.length; i++) d[i] *= 0.7 / (pk || 1); return B; }
