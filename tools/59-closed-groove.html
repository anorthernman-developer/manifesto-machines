ion"], ["a sound that one hears without seeing the causes behind it", "Schaeffer's Traité (1966) quoting a dictionary definition of 'acousmatic'. This is a translation and the wording varies, so treat it as a paraphrase."], ["Deprived of its percussion, the bell becomes an oboe sound", "Schaeffer on the cut bell, in English translation. The wording varies between sources."]], "system": "Each source slot is analysed when it loads. Its region (start to end, reversed if set) is cut into OBJECTS at detected onsets, or into equal parts, giving objects A to H. Each object gets a simplified Schaeffer-style label from its loudness envelope and periodicity: N = tonic (clear pitch), X = complex (noisy), ' = impulse (short), \" = iterative (repeated pulses), and no mark = sustained. Four turntables each play one object. In HIT mode it is retriggered on the active steps of the turntable's 16-step pattern. In CLOSED GROOVE mode it loops continuously and the steps open and close a gate. SPEED changes pitch and duration together, like changing disc speed. ATTACK CUT skips the first milliseconds and fades in, which is the cut bell. RELIEF slowly moves the turntables around the stereo field, after the 'pupitre d'espace' (the spatialisation desk Schaeffer's studio built in 1951). The AUTOMATIC ÉTUDE changes one thing every two bars."}, "design": {"name": "A. M. Cassandre", "short": "Cassandre", "who": "A. M. Cassandre (Adolphe Jean-Marie Mouron, 1901 to 1968), Ukrainian-born French poster artist and type designer", "era": "Paris, 1923 to 1939 (Art Deco)", "hallmarks": ["Geometry and huge scale: a locomotive, a ship's bow or a pair of rails reduced to bold shapes, often seen from very low down or converging to one vanishing point.", "Airbrushed gradients and a limited palette of navy, black, cream and red, with light that glows like a lamp in fog.", "Lettering built as part of the picture, often in his own display faces Bifur (1929) and Peignot (1937), with wide geometric capitals set
