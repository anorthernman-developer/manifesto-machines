nce I have always preferred making plans to executing them, I have gravitated towards situations and systems that, once set into operation, could create music with little or no intervention on my part.", "Brian Eno, sleeve notes to Discreet Music (1975)"]], "system": "Line A and line B are short loops of notes (scale degrees) with different total lengths in beats, so their alignment keeps changing. They play the LINE slots into an 8-band graphic EQ (peaking filters you draw; DRIFT nudges one band every few seconds, as Eno occasionally turned a knob), then a short echo, then the TAPE: two long delay lines (left and right, the right one about 7% longer, standing in for the two tape machines) whose output is fed back through tape saturation and a low-pass filter, so each pass is quieter and duller. WOW wobbles the tape speed slightly. The generation chart is an Isotype count: one symbol per note on the tape, one row per pass. LISTENING LEVEL and the H 'harp record' mode drop everything to a whisper in one speaker. The CANON players play the Pachelbel bass line (in your key) in different octaves, each at a slightly slower tempo than the last, so they start together and drift apart: the instrument's simplified take on the B side's tempo systems."}, "design": {"name": "Isotype (Otto Neurath, Marie Neurath and Gerd Arntz)", "short": "Isotype", "who": "Isotype (International System of Typographic Picture Education), developed by the philosopher Otto Neurath (1882 to 1945) with the 'transformer' Marie Reidemeister, later Neurath (1898 to 1986), and the artist Gerd Arntz (1900 to 1988), who cut the pictograms in linocut", "era": "Vienna 1925 to 1934 (as the 'Vienna Method of Pictorial Statistics'), then The Hague and, from 1942, Oxford and London", "hallmarks": ["Count, don't scale: a larger quantity is shown by more identical symbols, never by a bigger symbol. Here every note still on the tape is one symbol, and each pass of the tape is one row.", "Flat, simplified pictogram
