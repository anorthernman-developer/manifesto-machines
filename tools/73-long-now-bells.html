n. An 'extent' rings every possible row exactly once and returns to rounds.", "He did not stop at real bells. Working with software synthesis, he imagined bells made of materials and in shapes that could not exist, and track titles such as 'Fixed Ratio Harmonic Bells' and 'Emphasizing Enharmonic Partials' name the partial structures he tried.", "He wanted to hear a specific moment: the bells of January 07003, about halfway through the clock's life. The five-digit year is Long Now's convention for thinking past the year 9999."], "quotes": [["Stated briefly, change-ringing is the art (or, to many practitioners, the science) of ringing a given number of bells such that all possible sequences are used without any being repeated.", "Brian Eno, liner notes to January 07003 (2003)"], ["The ! is not an expression of surprise but the sign for a factorial", "Brian Eno, liner notes to January 07003"], ["I might therefore imagine bells with quite different physical properties from those we now know", "Brian Eno, liner notes to January 07003"], ["I wanted to hear the bells of the month of January, 07003 — approximately halfway through the life of the Clock.", "Brian Eno, liner notes to January 07003"]], "system": "Rows are generated from place notation, the ringers' own shorthand. 'x' (or '-') means every pair of bells swaps places, and a group of numbers such as '18' or '12' lists the places that stay put while every other pair swaps. Plain hunt, Plain Bob (on odd or even numbers of bells) and rounds are built in, and CUSTOM accepts any place notation you type, which repeats until rounds come back. Bell 1 (the treble) is the highest, tuned down the chosen scale to the tenor. The blue-line diagram draws the paths of the treble and one traced bell through the rows, the way method diagrams in ringing books do. LONG NOW mode turns each date into a day number counted from 1 January 02003 and maps it to one of the 3,628,800 orders of ten bells using the factorial number system (a Leh
