omes an emotional hook, even if the words are hard to make out.", "In our words: UK garage swings. The kick skips (the two-step), the hats shuffle, and the bass moves under the chords.", "In our words: the euphoric drop works by contrast: thin the track out, hold your breath for one empty beat, then bring everything back wider and brighter, sometimes a tone higher.", "In our words: a journal is a good structure. One recording and one line per day, played in order, tells the week."], "quotes": [], "system": "Slot 1 is the voice memo, slots 2 and 3 are field recordings. FIELD KIT finds the hits inside the trimmed field recording and sorts them by brightness into low, mid and high, then layers them on the kick, clap and hat steps. TUNED STREET runs the field recording through six narrow resonators set to the current chord's tones, so the noise follows the progression. The chop lane plays one of eight chops of the voice memo per step, pitched to the chord. A journal page runs for PAGE BARS: intro (the street alone), groove, build (high-pass sweep, an accelerating snare roll, a riser and one empty beat), drop (everything, wider, with optional key lift), and break (voice and street). With JOURNAL on, the pages play in order with their own progression and field recording.", "dubious": "The grooves, progressions and sounds are this tool's own. No recording, lyric or arrangement by any producer is used."}, "design": {"name": "Risograph zine printing (DIY self-publishing, 1990s to now)", "short": "Risograph zine", "who": "The risograph stencil duplicator, used by zine makers, small presses and art-school print studios", "era": "1990s to now", "hallmarks": ["Two spot inks, fluorescent pink and blue, printed one after the other so they never quite line up. Here the pink layer is offset from the blue, and the offset moves with the music.", "Grainy halftone dots, photocopier texture and cheap paper. The field recording is printed as a halftone strip, and the paper is off-white.",
