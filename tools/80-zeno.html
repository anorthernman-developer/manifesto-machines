ler steps can be completed in a finite time."], "quotes": [["whatever moves must reach the halfway point before it reaches the end", "Aristotle, Physics VI.9, reporting Zeno (public domain; our translation from the Greek)"], ["the fastest runner never catches the slowest, because the pursuer must first reach the place the pursued has just left, so the slower one always stays ahead", "Aristotle, Physics VI.9, reporting Zeno (public domain; our translation)"], ["the flying arrow is at rest", "Aristotle, Physics VI.9, reporting Zeno (public domain; our translation)"], ["time is not made up of indivisible nows", "Aristotle, Physics VI.9 (public domain; our translation)"]], "system": "DICHOTOMY: a race of RACE bars towards a goal pitch (TARGET semitones up). In Zeno's view each step lasts one beat, but each covers half of what is left in pitch and brightness, so the line gets endlessly close and never lands. In Aristotle's view each step also takes half the time of the last, so the steps add up to exactly the race length (1/2 + 1/4 + 1/8 ... = 1): the roll accelerates, lands on the goal hit and starts again. ACHILLES: a 16-note melody played at walking pace by the tortoise, starting HEAD START notes ahead, and the same melody chased SPEED times faster by Achilles. In Aristotle's view he simply runs and overtakes; in Zeno's view each stage (reaching where the tortoise just was) is given one whole bar. The gap shrinks by the speed ratio at every stage, so both runners seem to slow down: the canon tightens and freezes, he never passes, and the race starts again. ARROW: grains of slot 5 one MOMENT long. Zeno: each grain is repeated HOLD times at the same place, a still for every moment. Aristotle: the place moves continuously. STADIUM: three rows of hits on a 16-step grid; the first stands still, the second moves right and the third moves left, one step per bar times SPEED. FRAME hears them from the moving second row instead, so the first row moves one way and the third move function draw() { cv.fit(); const g = cv.g, W = cv.w, H = cv.h, pn = performance.now(), m = 18, pw = (W - m * 3) / 2, ph = (H - m * 3 - 30) / 2, RED = '#e2231a';
  g.fillStyle = '#f6f5f1'; g.fillRect(0, 0, W, H); g.fillStyle = '#111'; g.font = "700 22px 'Jost'"; g.fillText('ZEN', m, 32); const zw = g.measureText('ZEN').width; g.fillStyle = RED; g.beginPath(); g.arc(m + zw + 9, 24, 8, Math.PI / 2, Math.PI * 1.5); g.fill(); g.fillStyle = '#111'; g.beginPath(); g.arc(m + zw + 9, 24, 8, -Math.PI / 2, Math.PI / 2); g.fill();
  g.font = "400 12px 'DM Mono'"; g.fillText(st.aristotle ? "ARISTOTLE'S VIEW · THE STEPS ADD UP" : "ZENO'S VIEW · NOTHING ARRIVES", m + zw + 26, 30);

  // 1: halving ticks towards a goal
  { const [x, y] = P[0], y0 = y + ph * 0.6, x0 = x + 20, x1 = x + pw - 30; g.globalAlpha = on(0) ? 1 : 0.25; g.strokeStyle = '#111'; g.lineWidth = 2; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y0); g.stroke(); for (let k = 0; k < 12; k++) { const px = x0 + (x1 - x0) * (1 - Math.pow(2, -k)); g.fillRect(px - 1, y0 - 12 + k * 0.8, 2, 24 - k * 1.6); }

  // 3: the arrow, as stills or as flight

    g.globalAlpha = on(2) ? 1 : 0.25; const ax = x0 + (x1 - x0) * vis.r; g.fillStyle = '#111'; g.fillRect(ax - 60, y0 - 2, 60, 4); g.fillStyle = RED; g.beginPath(); g.moveTo(ax, y0 - 9); g.lineTo(ax + 18, y0); g.lineTo(ax, y0 + 9); g.fill(); g.fillStyle = '#111'; g.beginPath(); g.moveTo(ax - 60, y0); g.lineTo(ax - 72, y0 - 9); g.lineTo(ax - 66, y0); g.lineTo(ax - 72, y0 + 9); g.fill();

    g.globalAlpha = 1; } }
/* ---------- setup ---------- */
const cfg = { bpm: 96, div: 4, step, draw, start: () => { D = { t0: MM.now + 0.1, k: 0, next: MM.now + 0.1, done: false }; R = { pos: 0, next: MM.now + 0.1, n: 0 }; reset(); shiftT = 0; }, onSamples: (list) => MMX.assign(list),
  key: (e) => { if (MMX.key(e)) return; const k = e.key.toLowerCase(); if (k === 'z') view(); else if (k === 'f') MMX.setParam('frame', st.frame === 'A' ? 'B' : 'A'); else if (k >= '1' && k <= '5') setSolo(+k - 1); },
  setup() { MM.ensure(); cv = MM.canvas('#cv'); melody(); reset();
    Object.assign(MM.fb, { half: mk(1.4, (t) => [1, 2, 3, 5].reduce((s, h, j) => s + Math.sin(TAU * C4 * h * t) / (j + 1) * Math.exp(-t * (2 + j * 2)), 0) * Math.min(1, t * 400)), goal: mk(1.6, (t) => Math.sin(TAU * 55 * t * (1 + Math.exp(-t * 18))) * Math.exp(-t * 2.5) + (Math.random() - 0.5) * Math.exp(-t * 6) * 0.6), tort: mk(1.5, (t) => (Math.sin(TAU * C4 * t) + 0.4 * Math.sin(TAU * C4 * 2 * t) * Math.exp(-t * 3)) * Math.exp(-t * 1.5) * Math.min(1, t * 200)), achi: mk(0.8, (t) => (Math.sin(TAU * C4 * t) + 0.25 * Math.sin(TAU * C4 * 3 * t)) * Math.exp(-t * 6) * Math.min(1, t * 600)), arrow: arrowTex() });
    MMX.init({ state: st, slots: [{ label: 'Half-way voice', kind: 'half', rv: 0.25, dl: 0.1 }, { label: 'Goal hit', kind: 'goal', rv: 0.4 }, { label: 'Tortoise (C4)', kind: 'tort', rv: 0.2 }, { label: 'Achilles (C4)', kind: 'achi', rv: 0.15, dl: 0.1 }, { label: 'Arrow (long sound)', kind: 'arrow', rv: 0.3 }, { label: 'Stadium row 1 (still)', kind: 'kick', rv: 0 }, { label: 'Stadium row 2 (→)', kind: 'snare', rv: 0.05, gain: 0.7 }, { label: 'Stadium row 3 (←)', kind: 'hat', rv: 0, gain: 0.6 }],
      onSlot: (i) => { MMX.fire(i, MM.now + 0.03, { maxDur: 2 }); }, onPreset: () => { melody(); onViewQuiet(); }, factory: fac(),
      keys: [['Z', "Zeno's view or Aristotle's"], ['1 to 4', 'solo one paradox'], ['5', 'all four'], ['F', "stadium frame: the still row or the moving row"]],
      midiHelp: 'C2 (36) switches Zeno and Aristotle. D2 (38) restarts the race. Notes from C3 up play the tortoise sound at that pitch (C4 = as recorded).',
      midi: (n, v, on2) => { if (!on2) return; if (n === 36) view(); else if (n === 38) { reset(); D.k = 0; D.t0 = MM.now; D.next = MM.now; MM.toast('The race starts again'); } else MMX.fire(2, MM.now + 0.005, { semis: n - 60, gain: v }); } });
    const C = (id) => MM.$(id);
    MMX.ctl(C('#c0'), 'lvD', { label: 'Level', min: 0, max: 1.2 }); MMX.ctl(C('#c0'), 'race', { label: 'Race length', min: 1, max: 8, step: 1, fmt: (v) => v + ' bars' }); MMX.ctl(C('#c0'), 'target', { label: 'Goal interval', min: 1, max: 24, step: 1, fmt: (v) => '+' + v + ' st' }); MMX.ctl(C('#c0'), 'aristotle', { type: 'check', label: "Aristotle's view (Z)", on: onView });
    MMX.ctl(C('#c1'), 'lvA', { label: 'Level', min: 0, max: 1.2 }); MMX.ctl(C('#c1'), 'ratio', { label: 'Speed ratio', min: 1.1, max: 4, step: 0.1, on: reset }); MMX.ctl(C('#c1'), 'head', { label: 'Head start', min: 1, max: 16, step: 1, fmt: (v) => v + ' notes', on: reset }); MMX.ctl(C('#c1'), 'root', { type: 'select', label: 'Root', options: ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'].map((x, k) => [k, x]), on: melody }); MMX.ctl(C('#c1'), 'scale', { type: 'select', label: 'Scale', options: Object.keys(MM.SCALES).map((k) => [k, k]), on: melody });
    MMX.ctl(C('#c2'), 'lvR', { label: 'Level', min: 0, max: 1.2 }); MMX.ctl(C('#c2'), 'moment', { label: 'Moment', min: 0.02, max: 0.5, step: 0.01, fmt: (v) => (+v).toFixed(2) + ' s' }); MMX.ctl(C('#c2'), 'hold', { label: 'Hold (Zeno)', min: 1, max: 16, step: 1 }); MMX.ctl(C('#c2'), 'fly', { label: 'Flight speed', min: 0, max: 0.5, step: 0.01 });
    MMX.ctl(C('#c3'), 'lvS', { label: 'Level', min: 0, max: 1.2 }); MMX.ctl(C('#c3'), 'speed', { label: 'Speed', min: 0, max: 3, step: 0.25 }); MMX.ctl(C('#c3'), 'frame', { type: 'select', label: 'Frame (F)', options: [['A', 'from the still row'], ['B', 'from the moving row']] });
    MMX.ctl(C('#c4'), 'drone', { label: 'Drone', min: 0, max: 1 });
    MM.$('#b-z').onclick = () => view(); MM.$('#b-f').onclick = () => MMX.setParam('frame', st.frame === 'A' ? 'B' : 'A'); MM.$$('[data-solo]').forEach((b) => (b.onclick = () => setSolo(+b.dataset.solo))); setSolo(4); } };
function onViewQuiet() { D.k = 0; D.t0 = MM.now + 0.1; D.next = D.t0; reset(); const b = MM.$('#b-z'); if (b) b.textContent = st.aristotle ? "Z · Aristotle's view" : "Z · Zeno's view"; }
