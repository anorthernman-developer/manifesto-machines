    MMX.ctl(C2, 'bpm', { label: 'Tempo', min: 50, max: 180, step: 1, on: (v) => { MM.bpm = v; retime(); } }); MMX.ctl(C2, 'bars', { label: 'Page (bars)', min: 1, max: 8, step: 1, on: retime }); MMX.ctl(C2, 'grid', { type: 'select', label: 'Grid (G)', options: [[0, 'free'], [4, 'beats'], [8, 'eighths'], [16, 'sixteenths']] });
    MMX.ctl(C2, 'snap', { type: 'check', label: 'Snap pitch' }); MMX.ctl(C2, 'root', { type: 'select', label: 'Key', options: ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'].map((x, k) => [k, x]) }); MMX.ctl(C2, 'scale', { type: 'select', label: 'Scale', options: Object.keys(MM.SCALES).map((k) => [k, k]) }); MMX.ctl(C2, 'range', { label: 'Pitch range', min: 0, max: 24, step: 1 });
    MMX.ctl(C3, 'merzbau', { type: 'check', label: 'Merzbau (B)' }); MMX.ctl(C3, 'every', { label: 'Grow every', min: 1, max: 8, step: 1 }); MMX.ctl(C3, 'fade', { label: 'Fade per pass', min: 0.5, max: 1, step: 0.01 }); MMX.ctl(C3, 'maxFrag', { label: 'Most fragments', min: 4, max: 80, step: 1, on: trim });
    MMX.ctl(C4, 'echo', { label: 'Echo', min: 0, max: 1 }); MMX.ctl(C4, 'space', { label: 'Space', min: 0, max: 1 }); MMX.ctl(C4, 'grit', { label: 'Paper grit', min: 0, max: 1 });
    MM.$('#b-tear').onclick = () => tear(Math.floor(Math.random() * 6)); MM.$('#b-cut').onclick = commerz; MM.$('#b-rev').onclick = () => last && (last.rev = !last.rev); MM.$('#b-clear').onclick = () => { frags = []; last = null; };
    const el = MM.$('#cv');
    MM.drag(el, (px, py, ph, e) => { const A = area(cv.w, cv.h);
      if (ph === 'down') { const f = hitF(px, py); if (f && e.shiftKey) { frags = frags.filter((q) => q !== f); last = null; dragF = null; return; } if (f) { dragF = { f, dx: (px - A.x) / A.w - f.x, dy: py }; last = f; fire(f, MM.now + 0.01); return; }
        const x = MM.clamp((px - A.x) / A.w, 0, 0.999), y = MM.clamp(-((py - A.y - A.h / 2) / (A.h / 2)) / 0.9, -1, 1), nf = tear(st.mat, x, y); fire(nf, MM.now + 0.01); dragF = { f: nf, dx: 0, dy: py }; return; }
      if (ph === 'move' && dragF) { dragF.f.x = snapX((px - A.x) / A.w - dragF.dx); dragF.f.y = MM.clamp(-((py - A.y - A.h / 2) / (A.h / 2)) / 0.9, -1, 1); }
      if (ph === 'up') dragF = null; });
    el.addEventListener('pointermove', (e) => { const r = el.getBoundingClientRect(); hoverF = hitF(e.clientX - r.left, e.clientY - r.top); });
    el.addEventListener('wheel', (e) => { const r = el.getBoundingClientRect(), f = hitF(e.clientX - r.left, e.clientY - r.top) || last; if (!f) return; e.preventDefault(); const d = e.deltaY > 0 ? -1 : 1; if (e.shiftKey) f.size = MM.clamp(f.size + d * 0.08, 0.2, 1.8); else f.ang = MM.clamp(f.ang + d * 0.08, -1, 1); last = f; }, { passive: false });
    MM.aiBox(MM.$('#ai'), { title: 'FOUND MATERIALS → COLLAGE', help: 'Describe what is in your pockets, on your desk or in the street. Gemini lays out a collage of fragments from the six materials.', placeholder: 'a bus ticket, a wet leaf, a bent nail, a receipt for coffee, someone shouting a name',
      system: 'You compose a Merz sound collage after Kurt Schwitters, using six materials: ticket, newspaper, wood, wire, voice, piano. Reply with JSON only.',
      schema: { type: 'OBJECT', properties: { title: { type: 'STRING' }, fragments: { type: 'ARRAY', items: { type: 'OBJECT', properties: { material: { type: 'STRING', enum: ['ticket', 'newspaper', 'wood', 'wire', 'voice', 'piano'] }, x: { type: 'NUMBER' }, y: { type: 'NUMBER' }, size: { type: 'NUMBER' }, angle: { type: 'NUMBER' }, len: { type: 'NUMBER' } }, required: ['material', 'x', 'y'] } } }, required: ['fragments'] },
      user: (p) => `Found materials: ${p}\nMap each found thing to the closest of the six materials, and give 6 to 16 fragments: x 0 to 1 (time across the page), y -1 to 1 (pitch), size 0.3 to 1.6 (loudness), angle -1 to 1 (dark-left to bright-right), len 0.05 to 1.5 seconds. Add a short Merz-like title.`,
      apply: (r) => { const names = ['ticket', 'newspaper', 'wood', 'wire', 'voice', 'piano']; frags = []; (r.fragments || []).slice(0, 24).forEach((q) => { const m = names.indexOf(String(q.material).toLowerCase()); if (m < 0) return; const f = tear(m, MM.clamp(+q.x || 0, 0, 0.999), MM.clamp(+q.y || 0, -1, 1)); if (q.size) f.size = MM.clamp(+q.size, 0.2, 1.8); if (q.angle != null) f.ang = MM.clamp(+q.angle, -1, 1); if (q.len) { const R = MMX.region(m); f.len = MM.clamp(+q.len / R.len, 0.02, 1); f.pos = Math.random() * (1 - f.len); } }); return (r.title ? r.title + ': ' : '') + frags.length + ' fragments glued.'; },
      fallback: () => { frags = []; for (let k = 0; k < 10; k++) tear(k % 6); } });
    for (let k = 0; k < 12; k++) { const f = tear([2, 0, 5, 1, 4, 2, 3, 5, 4, 2, 0, 4][k], k / 12, [0, 0.5, 0.2, -0.3, 0.4, -0.2, 0.1, 0.6, -0.1, -0.4, 0.3, 0][k]); f.size = Math.max(f.size, 0.9); f.ang = +((k % 3) * 0.3 - 0.3).toFixed(2); f.rev = false; } } };
function commerz() { if (!last) { MM.toast('Touch a fragment first'); return; } const cut = last.len * 0.4; last.pos += cut; last.len -= cut; last.rs = ''; MM.toast('Commerz → Merz'); fire(last, MM.now + 0.01); }
function fac() { const base = JSON.parse(JSON.stringify(st)), F = (o) => ({ full: { params: Object.assign({}, base, o) } });
  return { 'Das Merzbild (default)': {}, 'Merzbau, growing': F({ merzbau: true, fade: 0.9, every: 1, bars: 4, bpm: 84 }), 'Unequal materials': F({ equal: false }), 'Free time, no grid': F({ grid: 0, snap: false, range: 18, echo: 0.5, space: 0.6 }), 'Short tears, fast': F({ tearLen: 0.08, bpm: 140, bars: 1, grid: 16, grit: 0.4 }) }; }
/* ---------- built-in materials ---------- */
function mk(len, fn) { const c = MM.ctx, sr = c.sampleRate, B = c.createBuffer(1, (sr * len) | 0, sr), d = B.getChannelData(0); let pk = 0; for (let i = 0; i < d.length; i++) { d[i] = fn(i / sr, i); pk = Math.max(pk, Math.abs(d[i])); } for (let i = 0; i < d.length; i++) d[i] *= 0.8 / (pk || 1); return B; }
const TAU = Math.PI * 2, F0 = 261.63;
function ticketBuf() { const ev = Array.from({ length: 14 }, (_, k) => ({ t: k * 0.17 + Math.random() * 0.05, d: 0.02 + Math.random() * 0.12, f: 0.2 + Math.random() * 0.6 })); let lp = 0; return mk(2.6, (t) => { let s = 0; ev.forEach((e) => { const u = t - e.t; if (u >= 0 && u < e.d) { lp += ((Math.random() * 2 - 1) - lp) * e.f; s += lp * Math.exp(-u * 30) + (u < 0.003 ? 0.8 * Math.sin(TAU * 1800 * u) : 0); } }); return s; }); }
function paperBuf() { let lp = 0, env = 0; return mk(3, (t) => { if (Math.random() < 0.0009) env = 0.5 + Math.random() * 0.5; env *= 0.9993; lp += ((Math.random() * 2 - 1) - lp) * 0.35; return lp * env * (0.6 + 0.4 * Math.sin(TAU * 3 * t)); }); }
function woodBuf() { const hits = [[0, 600], [0.32, 820], [0.55, 450], [0.9, 980], [1.15, 700], [1.6, 520]]; return mk(2, (t) => hits.reduce((s, [a, f]) => { const u = t - a; return u < 0 ? s : s + (Math.sin(TAU * f * u) + 0.4 * Math.sin(TAU * f * 2.7 * u)) * Math.exp(-u * 35) + (u < 0.004 ? (Math.random() - 0.5) * 1.5 : 0); }, 0)); }
function wireBuf() { const sr = MM.ctx.sampleRate, P = Math.round(sr / 110), buf = new Float32Array(P).map(() => Math.random() * 2 - 1); let k = 0; return mk(2.2, (t) => { const a = buf[k % P], b = buf[(k + 1) % P]; buf[k % P] = 0.499 * (a + b) * (1 - 0.001 * Math.sin(TAU * 7 * t)); k++; return a + Math.sin(TAU * (900 - 500 * Math.min(1, t * 2)) * t) * 0.3 * Math.exp(-t * 3); }); }
function pianoBuf() { return mk(2.5, (t) => { let s = 0; for (let k = 1; k <= 8; k++) s += (Math.sin(TAU * F0 * k * Math.sqrt(1 + 0.0004 * k * k) * t + k) / Math.pow(k, 1.3)) * Math.exp(-t * (1 + k * 0.6)); return s * Math.min(1, t * 600); }); }
function ursBuf() { // syllables in the spirit of the Ursonate's opening: consonant burst + formant vowel, with gaps
  const sr = MM.ctx.sampleRate, V = { ü: [300, 1700, 2200], ö: [450, 1500, 2400], ä: [650, 1700, 2500], u: [320, 800, 2240], o: [500, 900, 2400], i: [280, 2300, 3000], e: [450, 2000, 2600] };
  const S = [['f', 'ü', 0.38, 120], ['b', 'ö', 0.22, 140], ['w', 'ö', 0.22, 130], ['t', 'ä', 0.3, 150], ['z', 'ä', 0.3, 145], ['', 'u', 0.45, 110], ['p', 'ö', 0.18, 135], ['k', 'i', 0.25, 160], ['', 'e', 0.4, 125]];
  let T = 0.05; const segs = S.map(([c, v, d, f]) => { const x = { c, v, d, f, a: T }; T += d + 0.12; return x; }); const B = MM.ctx.createBuffer(1, (sr * (T + 0.1)) | 0, sr), out = B.getChannelData(0);
  segs.forEach((sg) => { const n0 = (sg.a * sr) | 0, cn = sg.c ? (0.05 * sr) | 0 : 0, nv = (sg.d * sr) | 0, st2 = [[0, 0], [0, 0], [0, 0]]; let ph = 0, lp = 0;
    for (let n = 0; n < cn; n++) { lp += ((Math.random() * 2 - 1) - lp) * (sg.c === 'f' || sg.c === 'z' ? 0.7 : 0.3); out[n0 + n] += lp * 0.25 * (sg.c === 'b' || sg.c === 'p' || sg.c === 't' || sg.c === 'k' ? Math.exp(-n / sr * 120) : 1); }
    for (let n = 0; n < nv; n++) { const u = n / nv, f = sg.f * (1 + 0.15 * (1 - u)); ph += f / sr; const pulse = ph % 1 < 0.08 ? 1 : 0; let y = 0; V[sg.v].forEach((fc, k) => { const r = Math.exp(-Math.PI * (80 + 40 * k) / sr), w = (TAU * fc) / sr, s = st2[k], v = pulse + 2 * r * Math.cos(w) * s[0] - r * r * s[1]; s[1] = s[0]; s[0] = v; y += v / (k + 1); }); out[n0 + cn + n] += y * 0.02 * Math.min(1, u * 15) * Math.min(1, (1 - u) * 6); } });
  let pk = 0; for (const x of out) pk = Math.max(pk, Math.abs(x)); for (let i = 0; i < out.length; i++) out[i] *= 0.8 / (pk || 1); return B; }
MM.init(cfg);
