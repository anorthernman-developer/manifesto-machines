<meta name="description" content="In the late 1950s a group of artists in Düsseldorf took the name ZERO. They borrowed it from the countdown before a rocket launch, and from the idea of a zone of silence from which something new can begin. Their work favoured light, vibration, repetition and pure, quiet structure over expression and story. This instrument turns that attitude into sound. Seven repeating voices of your own sounds make a calm, even field. A countdown removes them one by one, down to zero, where only a single quiet tone and silence remain. Then the field begins again, perhaps in a new key. Small controls let the voices drift out of step, wobble in pitch like light on a surface, or lock tightly in time.">
