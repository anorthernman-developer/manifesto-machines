      system: 'You are Mikhail Larionov arranging a Rayonist painting that is also a score. Choose 4 to 8 everyday objects from the scene. x is 0..1 left to right (it is also time), y is 0..1 top to bottom (top = high pitch). c is a colour index 0 orange, 1 gold, 2 magenta, 3 sky blue, 4 green, 5 violet. slot is a timbre 0..3 (0 bright, 1 glassy, 2 metallic, 3 voice). rays 2..8, spin -2..2. Reply with JSON only.',
      schema: { type: 'OBJECT', properties: { objects: { type: 'ARRAY', items: { type: 'OBJECT', properties: { name: { type: 'STRING' }, x: { type: 'NUMBER' }, y: { type: 'NUMBER' }, c: { type: 'INTEGER' }, slot: { type: 'INTEGER' }, rays: { type: 'INTEGER' }, spin: { type: 'NUMBER' } }, required: ['name', 'x', 'y'] } }, bpm: { type: 'INTEGER' }, scale: { type: 'STRING', enum: Object.keys(MM.SCALES) }, note: { type: 'STRING' } }, required: ['objects'] },
      user: (p) => `Scene: ${p}\nPlace the objects, choose a tempo between 70 and 160 and a scale, and add one sentence on what the rays reveal.`,
      apply: (r) => { if (!r.objects || !r.objects.length) return 'Gemini sent no objects'; setObjs(r.objects); if (r.bpm) MMX.setParam('bpm', MM.clamp(r.bpm | 0, 60, 180)); if (r.scale && MM.SCALES[r.scale]) MMX.setParam('scale', r.scale); if (!MM.playing) MM.toggle(true); return r.note || 'Scene placed.'; },

    MM.$('#ttl').innerHTML = [...'RAYONISM'].map((c, k) => `<span style="color:${PAL[k % PAL.length]};-webkit-text-stroke:2px #141414">${c}</span>`).join('');

function fac() { const base = JSON.parse(JSON.stringify(st)), F = (o, ob) => ({ full: { params: Object.assign({}, base, o), extra: ob ? { objs: ob } : null } });
  return { 'Street, 1913 (default)': {}, 'Objects play no role': F({ noObj: true, rays: 7, spread: 1.6, len: 0.8, motor: 0, hum: 0, scale: 'whole', scan: 4 }),
    'Futurist motor': F({ bpm: 132, motor: 0.65, scan: 1, maxPer: 2, rays: 4, scale: 'phrygian', root: 4 }), 'Glancing light': F({ spread: 0.35, len: 1.1, reflect: true, rot: 0.04, scan: 8, bpm: 84, scale: 'lydian', root: 7, motor: 0, echo: 0.5 }),
    'Two objects': F({ rays: 9, spread: 1.5, len: 0.9, motor: 0.15 }, [{ name: 'trolley', x: 0.3, y: 0.5, c: 0, slot: 0, rays: 0, spin: 1, dir: 0 }, { name: 'steamship', x: 0.7, y: 0.5, c: 3, slot: 2, rays: 0, spin: -1, dir: 3.1 }]) }; }
/* built-in timbres, tuned to C4 */
function mk(len, fn) { const ctx = MM.ctx, sr = ctx.sampleRate, B = ctx.createBuffer(1, (sr * len) | 0, sr), d = B.getChannelData(0); let pk = 0; for (let i = 0; i < d.length; i++) { d[i] = fn(i / sr); pk = Math.max(pk, Math.abs(d[i])); } for (let i = 0; i < d.length; i++) d[i] *= 0.7 / (pk || 1); return B; }
function rayTone() { const f = MM.mtof(60); return mk(1.4, (t) => { let s = 0; for (let k = 1; k < 9; k++) s += Math.sin(2 * Math.PI * f * k * t) / k * Math.exp(-t * (2 + k * 1.5)); return s * Math.min(1, t * 900); }); }
function glassTone() { const f = MM.mtof(60); return mk(1.6, (t) => (Math.sin(2 * Math.PI * f * t) + 0.5 * Math.sin(2 * Math.PI * f * 4.2 * t) * Math.exp(-t * 6)) * Math.exp(-t * 2.2) * Math.min(1, t * 1200)); }
function metal() { const f = MM.mtof(60); return mk(1.8, (t) => [1, 1.41, 2.17, 2.93, 3.7].reduce((s, m, k) => s + Math.sin(2 * Math.PI * f * m * t) * Math.exp(-t * (1.5 + k)) / (k + 1), 0) * Math.min(1, t * 2000)); }
