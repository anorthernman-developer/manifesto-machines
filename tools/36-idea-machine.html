  setup() { list(); execute(); MM.aiBox(MM.$('#ai'), { title: 'write instructions', help: 'Gemini writes wall-drawing instructions for this machine, which then carries them out exactly.', placeholder: 'a calm harbour at dawn',
      system: 'You write instructions for a wall drawing in the manner of Sol LeWitt (do not quote him). The machine understands only this grammar. Return JSON {"rules":[{"n":1-12,"kind":one of ' + JSON.stringify(KINDS) + ',"from":one of ' + JSON.stringify(EDGES) + ',"to":one of ' + JSON.stringify(TOS) + ',"col":one of ' + JSON.stringify(CN) + '}]} with 2 to 5 rules that suit the prompt.',
      schema: { type: 'object', properties: { rules: { type: 'array', items: { type: 'object', properties: { n: { type: 'number' }, kind: { type: 'string' }, from: { type: 'string' }, to: { type: 'string' }, col: { type: 'string' } }, required: ['n', 'kind', 'from', 'to', 'col'] } } }, required: ['rules'] },
      apply(j) { const rs = (j.rules || []).filter((r) => KINDS.includes(r.kind) && EDGES.includes(r.from) && TOS.includes(r.to) && CN.includes(r.col)).map((r) => ({ ...r, n: MM.clamp(Math.round(r.n) || 1, 1, 12) })); if (!rs.length) throw new Error('no usable instructions'); R = rs.slice(0, 6); list(); execute(); return R.length + ' instructions executed.'; },
      fallback() { R = [rand(), rand(), rand()]; list(); execute(); } }); },
  step(i, t, sd) { const x = i % GW; cur = x; (grid[x] || []).forEach((c) => VOICE[c.col](t, MM.deg(GH - 1 - c.y, 'penta', 48), sd)); if (x % 4 === 0) MM.play(MM.fb.kick, t, { gain: 0.35 }); },
  draw() { C.fit(); const g = C.g, w = C.w, h = C.h, m = 30, cw = (w - 2 * m) / GW, ch = (h - 2 * m) / GH; g.fillStyle = '#f4f4f2'; g.fillRect(0, 0, w, h); g.strokeStyle = '#dde2e7'; g.lineWidth = 1;
    for (let x = 0; x <= GW; x++) { g.beginPath(); g.moveTo(m + x * cw, m); g.lineTo(m + x * cw, m + GH * ch); g.stroke(); } for (let y = 0; y <= GH; y++) { g.beginPath(); g.moveTo(m, m + y * ch); g.lineTo(m + GW * cw, m + y * ch); g.stroke(); }
    if (MM.playing && cur >= 0) { g.fillStyle = 'rgba(42,157,244,.1)'; g.fillRect(m + cur * cw, m, cw, GH * ch); (grid[cur] || []).forEach((c) => { g.fillStyle = COLS[c.col]; g.fillRect(m + cur * cw + 2, m + c.y * ch + 2, cw - 4, ch - 4); }); }
    g.lineWidth = 3; g.lineCap = 'round'; lines.forEach((l) => { g.strokeStyle = COLS[l.col]; g.beginPath(); let pen = false; l.P.forEach((p) => { if (!p) { pen = false; return; } const X = m + p[0] * cw, Y = m + p[1] * ch; pen ? g.lineTo(X, Y) : g.moveTo(X, Y); pen = true; }); g.stroke(); }); }
});

</script>
