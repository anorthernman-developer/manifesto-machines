, "system": "Your seed phrase is read as scale degrees. Every step from one note to the next is counted in a table (and every pair-to-next in a second table when MEMORY is 2). Each plant has its own register, voice and pace (they are deliberately unequal), keeps its last note or two, and picks the next from the table weighted by how often it was seen. TEMPERATURE flattens or sharpens that choice. WEEDS adds notes that are not in the table. HABIT feeds a small amount of each generated step back into the table, so favourite paths grow. Notes you play are counted heavily. The season wheel scales how many plants are awake, how often they play, how bright the filter is and whether the garden sits an octave lower. ATTENTION lowers level and brightness for background listening and, when high, makes the garden recite its seed slowly now and then.", "dubious": "The mapping of probabilities to plants and seasons is this tool's own. Markov's work was on chains of letters in a poem, not music; its use for composition came later and is a general technique, so no one person's piece is used here."}, "design": {"name": "Mid-century seed packets and nursery catalogue illustration", "short": "Seed packet", "who": "Garden-seed and nursery packaging designers, 1940s to 1960s", "era": "1940s to 1960s", "hallmarks": ["A bold banner title in a fat display serif on a flat colour, with the plant's name and a short growing note beneath. The title and strapline here follow that.", "A limited palette of cream, tomato red, leaf green and ochre, printed flat with slight misregistration, and a central illustration of the plant at full size.", "Small instruction panels: sow, depth, season, spacing. The right-hand panel and the season wheel play that role here."], "works": ["Look up vintage seed packets from the 1940s to 1960s", "Mid-century nursery and seed catalogues", "The botanical plates that fed them, such as those of the 19th century"]}, "no": "88", "slug": "learned-garden", "file": "tools/8
