<script>window.MM_META = {"title": "Spoken Mantra", "deep": true, "gemini": true, "category": "Fred", "date": "2026-10-29", "kicker": "WHAT WOULD FRED AGAIN.. DO? · FOUND SPEECH", "ideas_note": "", "idea": "A spoken sentence, not a sung one, becomes the whole song, the way Fred again.. built 'Marea (we've lost dancing)' around The Blessed Madonna's speaking voice. The speech is cut into words, you choose which words make the mantra, a piano listens to the pitch of each word and harmonises it, and the arrangement runs intro, mantra, build (the phrase shrinks to one stuttering word), a beat of silence, then a pumping house or two-step drop.", "controls": "6 slots (speech, piano, kick, clap, hats, field recording); click words to build the mantra; word chopping by gaps or equal slices; phrase timing natural or quantised; key, mode and progression or 'follow the speech'; groove (house, two-step, half-time, none), sidechain pump, hook density and re-pitched hooks; section lengths, auto-arrange or play sections by hand with a held build; riser, echo and space; optional Gemini that turns a moment you describe into an arrangement.", "how": "Press PLAY. The built-in 'speech' is cut into words (the boxes in the SPEECH window). Click a word to take it in or out of the mantra. The piano reads the pitch of each word and picks a chord that contains it. With AUTO on, the song moves through INTRO, MANTRA, BUILD, DROP and BREAK by itself; press 1 to 5 to jump to a section at the next bar, or Enter for the next one. With AUTO off, the build holds on its last stutter until you press Enter, and the drop lands after a beat of silence. Drop a voice memo or any spoken sample onto the page (it goes to the SPEECH slot), or press D for all six slots.", "fonts": "family=Pixelify+Sans:wght@400;600;700&family=Inconsolata:wght@400;700", "bpm": 128, "try": ["Record ten seconds of a friend talking on your phone (a voice note is perfect), drop it in, and switch off every word except the two that hit you. Set CHOP to 'gaps' and PHRASE TIMING to '8ths' so the words land on the grid, then let AUTO run to the drop.", "Load a long field recording from your Splice folder (rain, a station, a crowd) into FIELD and a soft felt-piano one-shot recorded at C into PIANO. Set PROGRESSION to 'follow the speech', GROOVE to 'two-step' and PUMP to 0.7: the piano follows your talker's voice and breathes with the kick.", "Turn AUTO off, play MANTRA for a while, press 3 for the BUILD and let it hold on the one-word stutter as long as you can bear. Press Enter, listen to the beat of silence, then the drop. Record it with R and use the WAV as a new speech sample."], "manifesto": {"name": "What would Fred again.. do? Found speech as the song: the 'Marea (we've lost dancing)' method", "short": "Fred again.. found speech", "author": "Fred again.. (Fred Gibson, b. 1993, London), with The Blessed Madonna (Marea Stamper)", "year": "2021", "where": "'Marea (we've lost dancing)', Fred again.. and The Blessed Madonna, single released in early 2021 and later on 'Actual Life (April 14 – December 17 2020)'. Also his habit of naming tracks after the person whose voice is in them: 'Kyle (i found you)', 'Delilah (pull me out of this)', 'Billie (loving arms)'.", "ideas": ["The voice in a Fred again.. track is often speaking, not singing: a few words lifted from a conversation, a voice note or a video, repeated until they become a hook. 'Marea (we've lost dancing)' is built around The Blessed Madonna talking about the loss of dancing during the 2020 lockdowns.", "The track is named after the person whose voice it uses, with their phrase in brackets. The sample is treated as a portrait of a real person at a real moment.", "Repetition changes meaning: a sentence heard once is information; heard sixteen times over chords it becomes a mantra, and then something you can dance to.", "The arrangement does the emotional work: a quiet, almost ambient opening with piano, a long build in which the phrase is cut shorter and shorter, and a euphoric drop with a pumping house kick.", "He has often said in interviews that he collects these moments constantly on his phone and that the emotional weight of the real voice matters more than polish. (Paraphrase.)"], "quotes": [], "system": "The SPEECH slot is cut into words, either at the gaps between them (energy below a threshold) or into equal slices. Each word's pitch is estimated by autocorrelation and snapped to the key. You choose which words form the MANTRA. In PROGRESSION 'follow the speech', each bar's chord is a diatonic triad that contains the pitch of that bar's lead word, so the piano harmonises the speaking voice (this is the instrument's interpretation, not a claim about how Fred works). Sections: INTRO (speech, field recording and soft held piano), MANTRA (the phrase every bar, piano on the beat), BUILD (the phrase shrinks: whole phrase, last two words, last word on beats, then 8ths and 16ths, with a riser, rising filter and snare roll; the final beat is silent), DROP (full groove, sidechain pump on piano and field, and re-pitched hooks made of the lead word tuned to the chord), BREAK (no drums, long reverb). AUTO moves through them; without AUTO the build holds until you press Enter."}, "design": {"name": "Susan Kare", "short": "Susan Kare", "who": "Susan Kare (b. 1954), American artist and designer, who drew the original icons, bitmap fonts and interface graphics for the Apple Macintosh (1983 to 1986), and later icons for Windows 3.0 and many others", "era": "Apple, Cupertino, 1983 to 1986, and after", "hallmarks": ["Icons drawn on a grid of square pixels, often 32 × 32, in pure black and white, with enormous character in very few dots. Here every section is a hand-drawn pixel icon (moon, speech balloon, stairs, bomb, cup), and the bomb nods to her system-error icon.", "Bitmap typefaces designed for the screen and named after cities (Chicago, Geneva, New York). Here a pixel face stands in for Chicago in the title bars and menus.", "The 1-bit desktop: a dithered grey pattern, windows with striped title bars and close boxes, the menu bar across the top. The command-key symbol she adopted (⌘) came from a Swedish sign for a place of interest; it appears in the menu bar here."], "works": ["Original Macintosh icons: the trash can, the watch, the paintbrush, the bomb (1984)", "The Chicago, Geneva and Monaco bitmap fonts (1984)", "Windows 3.0 Solitaire card deck (1990)"]}, "no": "62", "slug": "spoken-mantra", "file": "tools/62-spoken-mantra.html"};</script>
