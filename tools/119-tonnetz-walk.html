function draw(){cv.fit();const g=cv.g,W=cv.w,H=cv.h,vj=MMX.vjOn,lv=MMX.level();level+=(lv.rms-level)*0.25;flash*=0.94;
  const s=vj?Math.min(W,H)/11:Math.max(26,Math.min(W,H)/13),hx=(q,r)=>[s*Math.sqrt(3)*(q+r/2),s*1.5*r];
  const cen=(c)=>{const h=hexes(c).map(([q,r])=>hx(q,r));return[(h[0][0]+h[1][0]+h[2][0])/3,(h[0][1]+h[1][1]+h[2][1])/3];};
  const [tx,ty]=cen(chord);cam.x+=(tx-cam.x)*0.06;cam.y+=(ty-cam.y)*0.06;const ox=W/2-cam.x,oy=(H-70)/2-cam.y;
  g.fillStyle=vj?'#1d2119':'#e8e2c8';g.fillRect(0,0,W,H);
  const key=st.keyMap|0,dia=[0,2,4,5,7,9,11].map(x=>md(x+key,12)),cp=pcs(chord);tris=[];
  const qr=Math.ceil(W/(s*1.7))+2,rr=Math.ceil(H/(s*1.5))+2,cq=Math.round(cam.x/(s*Math.sqrt(3))),crr=Math.round(cam.y/(s*1.5));
  for(let r=crr-rr;r<=crr+rr;r++)for(let q=cq-qr-Math.ceil(r/2)-(crr-r);q<=cq+qr-Math.floor(r/2)+(r-crr)+2;q++){const [x,y]=hx(q,r),X=x+ox,Y=y+oy;if(X<-s*2||X>W+s*2||Y<-s*2||Y>H+s*2)continue;const pc=pcAt(q,r),inC=cp.includes(pc),inK=dia.includes(pc);
    g.beginPath();for(let k=0;k<6;k++){const a=Math.PI/180*(60*k-30);g.lineTo(X+s*Math.cos(a),Y+s*Math.sin(a));}g.closePath();
    g.fillStyle=vj?(inK?'#2d3524':'#232a1d'):(inK?TER[md(q*3+r*5,3)]:'#cdbf93');g.fill();g.strokeStyle=vj?'#4a5540':'#7c7a5f';g.lineWidth=1;g.stroke();
    if(!inK&&!vj){g.strokeStyle='rgba(110,90,50,.25)';g.beginPath();for(let k=-2;k<=2;k++){g.moveTo(X-s*0.5,Y+k*s*0.22);g.lineTo(X-s*0.2,Y+k*s*0.22-4);g.lineTo(X+s*0.1,Y+k*s*0.22);}g.stroke();}
    g.fillStyle=vj?'#a8b195':'#4b4a3a';g.font=`400 ${Math.max(8,s*0.2)}px 'Share Tech Mono'`;g.textAlign='center';g.fillText(String(md(q+50,100)).padStart(2,'0')+String(md(r+50,100)).padStart(2,'0'),X,Y-s*0.55);
    g.fillStyle=vj?(inC?'#f4efd8':'#8f9a7d'):(inC?'#262420':'#555443');g.font=`700 ${s*(inC?0.5:0.4)}px 'Roboto Condensed'`;g.fillText(NM[pc],X,Y+s*0.18);
    [{q,r,m:false},{q,r,m:true}].forEach(c=>{const [a,b]=cen(c);tris.push([a+ox,b+oy,c]);});}
  // trail of previous chords
  g.strokeStyle=vj?'#f4efd8':'#262420';g.lineWidth=2;g.setLineDash([6,5]);g.beginPath();hist.forEach((h,k)=>{const [a,b]=cen(h.c);k?g.lineTo(a+ox,b+oy):g.moveTo(a+ox,b+oy);});g.stroke();g.setLineDash([]);
  // current triangle outline and the counter
  const hs=hexes(chord).map(([q,r])=>hx(q,r));g.strokeStyle=vj?'#f4efd8':'#262420';g.lineWidth=3;g.beginPath();hs.forEach(([a,b],k)=>k?g.lineTo(a+ox,b+oy):g.moveTo(a+ox,b+oy));g.closePath();g.stroke();
  const [ccx,ccy]=cen(chord),cs=s*(0.95+level*0.8+flash*0.15),X0=ccx+ox-cs/2,Y0=ccy+oy-cs/2;g.fillStyle='rgba(0,0,0,.35)';g.fillRect(X0+4,Y0+4,cs,cs);g.fillStyle='#c4362b';g.fillRect(X0,Y0,cs,cs);
  g.strokeStyle='#f4efd8';g.lineWidth=1.5;g.strokeRect(X0+cs*0.2,Y0+cs*0.14,cs*0.6,cs*0.32);g.beginPath();g.moveTo(X0+cs*0.2,Y0+cs*0.14);g.lineTo(X0+cs*0.8,Y0+cs*0.46);g.moveTo(X0+cs*0.8,Y0+cs*0.14);g.lineTo(X0+cs*0.2,Y0+cs*0.46);g.stroke();
  g.fillStyle='#f4efd8';g.font=`700 ${cs*0.3}px 'Roboto Condensed'`;g.textAlign='center';g.fillText(name(chord),X0+cs/2,Y0+cs*0.82);
  // turn record track
  const S=seqMoves(),tw=Math.min(36,(W-40)/Math.max(8,S.length+1)),ty0=H-58;g.fillStyle=vj?'#262c20':'#f1ecd8';g.fillRect(0,ty0-14,W,72);g.fillStyle=vj?'#f4efd8':'#262420';g.textAlign='left';g.font="700 12px 'Roboto Condensed'";g.fillText('TURN RECORD TRACK · SEQUENCE '+(S.join('')||'(random)')+(st.walk?' · WALKING':' · HOLDING'),16,ty0);
  S.forEach((m,k)=>{const x=16+k*tw,cur=((si-1)%S.length+S.length)%S.length===k;g.strokeStyle=vj?'#f4efd8':'#262420';g.lineWidth=cur?2.5:1;g.strokeRect(x,ty0+8,tw-4,tw-4);g.fillStyle=vj?'#f4efd8':'#262420';g.textAlign='center';g.font=`700 ${tw*0.5}px 'Share Tech Mono'`;g.fillText(m,x+(tw-4)/2,ty0+8+tw*0.62);});
  if(!vj){const bx=W-262,by=14;g.fillStyle='rgba(241,236,216,.94)';g.fillRect(bx,by,248,94);g.strokeStyle='#262420';g.lineWidth=1.5;g.strokeRect(bx,by,248,94);g.fillStyle='#262420';g.textAlign='left';g.font="700 12px 'Roboto Condensed'";g.fillText('MOVE EFFECTS CHART',bx+8,by+17);g.font="400 12px 'Share Tech Mono'";
    ['P  third moves 1 semitone','L  one note moves 1 semitone','R  one note moves 2 semitones','right = 5th, down-right = maj 3rd'].forEach((l,k)=>g.fillText(l,bx+8,by+36+k*15));}}
const mk=(len,fn)=>{const c=MM.ctx,sr=c.sampleRate,b=c.createBuffer(1,(sr*len)|0,sr),d=b.getChannelData(0);let pk=0;for(let i=0;i<d.length;i++){d[i]=fn(i/sr);pk=Math.max(pk,Math.abs(d[i]));}for(let i=0;i<d.length;i++)d[i]*=0.8/(pk||1);return b;};
const C4=261.63;
const FBS={pad:()=>mk(5,t=>[1,2,3,4,6].reduce((s,h,j)=>s+Math.sin(TAU*C4*h*t*(1+0.0015*Math.sin(TAU*0.4*t+j)))/(h*h*0.6+0.4),0)*Math.min(1,t/0.25)*Math.exp(-t*0.25)),
  bass:()=>mk(2,t=>(Math.sin(TAU*65.41*t)+0.35*Math.sin(TAU*130.81*t)+0.15*Math.sin(TAU*196.2*t))*Math.min(1,t*150)*Math.exp(-t*1.2)),
  pluck:()=>mk(1.2,t=>{let v=0;for(let h=1;h<9;h++)v+=Math.sin(TAU*C4*h*t)*Math.exp(-t*(3+h*2))/h;return v*Math.min(1,t*800);}),
  bell:()=>mk(2.5,t=>[1,2.76,5.4].reduce((s,h,j)=>s+Math.sin(TAU*C4*h*t)*Math.exp(-t*(1.4+j*2))/(j+1),0)*Math.min(1,t*500)),
  kick:()=>mk(0.45,t=>Math.sin(TAU*(50*t+70*(1-Math.exp(-t*28))/28))*Math.exp(-t*8)),
  shk:()=>mk(0.12,t=>(R()*2-1)*Math.sin(Math.PI*t/0.12)**3)};
const cfg={bpm:92,div:4,swing:0,step,draw,start:()=>{si=0;},stop:()=>{},
  onSamples:list=>{MMX.assign(list);sound(MM.now+0.02,false);},
  key:e=>{if(MMX.key(e))return;const k=e.key.toLowerCase();if(k==='z')hand('P');else if(k==='x')hand('L');else if(k==='c')hand('R');else if(k==='w'){MMX.setParam('walk',!st.walk);MM.toast(st.walk?'Walking':'Holding');}else if(k==='v')randomSeq();else if(k==='h'){MM.ensure();setChord({q:0,r:0,m:false},'JUMP',MM.now+0.01);MM.toast('Home: C major');}},
  setup(){MM.ensure();const c=MM.ctx;N.mix=c.createGain();N.mix.connect(MM.out);Object.entries(FBS).forEach(([k,f])=>MM.fb[k]=f());cv=MM.canvas('#cv');
    MMX.init({state:st,slots:[['Pad (pitched, plays the chord)','pad'],['Bass (root)','bass'],['Arpeggio pluck','pluck'],['Moving-note bell','bell'],['Soft kick','kick'],['Shaker','shk']].map(([label,kind],i)=>({label,kind,rv:[0.35,0.05,0.25,0.3,0.02,0.05][i],dl:i===2?0.15:0,gain:0.9})),
      onSlot:i=>{if(!MM.playing)MMX.fire(i,MM.now+0.02,{maxDur:2,dest:N.mix});},onTrim:()=>{},onPreset:()=>{si=0;info();},
      factory:fac(),extra:{get:()=>({chord}),set:x=>{if(x&&x.chord&&Number.isFinite(x.chord.q)){chord=x.chord;voices=lead(pcs(chord));info();}}},
      keys:[['Z','P: parallel (major and minor swap)'],['X','L: leading-tone move'],['C','R: relative major or minor'],['W','walk or hold'],['V','random sequence'],['H','home to C major'],['click','jump to a triangle']],
      midiHelp:'Each note steers the walk to the neighbouring chord that contains it (or jumps to the major chord on that note). CC 1 chord length, CC 2 random-move chance.',midi:(n,v,on)=>{if(on)steer(md(n,12));}});
    MMX.vj('#view');const C=[0,1,2].map(k=>MM.$('#c'+k));
    MMX.ctl(C[0],'seq',{type:'text',label:'Sequence',on:()=>{si=0;}});MMX.ctl(C[0],'walk',{type:'check',label:'Walk'});MMX.ctl(C[0],'beats',{label:'Beats a chord',min:1,max:8,step:1,cc:1});MMX.ctl(C[0],'rnd',{label:'Random move',min:0,max:1,cc:2});
    MMX.ctl(C[0],'keyMap',{type:'select',label:'Map key',options:NM.map((n,j)=>[j,n+' major'])});
    MMX.ctl(C[1],'arp',{type:'select',label:'Pattern',options:[['updown','Up and down'],['up','Up'],['down','Down'],['broken','Broken'],['random','Random']]});MMX.ctl(C[1],'arpDiv',{type:'select',label:'Rate',options:[[1,'Sixteenths'],[2,'Eighths'],[4,'Crotchets']]});MMX.ctl(C[1],'arpDen',{label:'Density',min:0,max:1});MMX.ctl(C[1],'arpOct',{label:'Octaves',min:1,max:3,step:1});
    MMX.ctl(C[2],'pad',{label:'Pad',min:0,max:1.5});MMX.ctl(C[2],'bass',{label:'Bass',min:0,max:1.5});MMX.ctl(C[2],'bell',{label:'Moving note',min:0,max:1.5});MMX.ctl(C[2],'drums',{label:'Drums',min:0,max:1.5});MMX.ctl(C[2],'rev',{label:'Reverb',min:0,max:1});MMX.ctl(C[2],'lv',{label:'Level',min:0,max:1.5});
    voices=lead(pcs(chord));info();MM.drag(MM.$('#cv'),hit);MM.$('#b-p').onclick=()=>hand('P');MM.$('#b-l').onclick=()=>hand('L');MM.$('#b-r').onclick=()=>hand('R');MM.$('#b-w').onclick=()=>{MMX.setParam('walk',!st.walk);MM.toast(st.walk?'Walking':'Holding');};MM.$('#b-v').onclick=randomSeq;}};
function fac(){const b0=JSON.parse(JSON.stringify(st)),P=o=>({full:{params:Object.assign({},b0,o),extra:null}});
  return{'PLR walk (default)':{},'Six-chord circle (PL)':P({seq:'PL',beats:2,arp:'up'}),'Eight-chord circle (PR)':P({seq:'PR',beats:2,arp:'broken'}),'The long chain (LR)':P({seq:'LR',beats:2,arpDiv:1,arpDen:0.6}),'Slow film-score drift':P({seq:'PLPR',beats:8,rnd:0.25,arpDen:0.3,drums:0,pad:0.9,bell:0.8}),'Hold and play by hand':P({walk:false,beats:4,arpDen:0.9})};}
