<script>window.MM_META = {"title": "USB Folder", "deep": true, "gemini": true, "category": "Fred", "date": "2026-10-30", "kicker": "WHAT WOULD FRED AGAIN.. DO? · USB, 2024 TO 2025", "bpm": 126, "idea": "Fred again..'s USB as an instrument: not an album but an ever-growing folder of tunes for rooms full of people. Cut a live vocal into its lines and switch their order round (the way he rebuilt Jamie T's words for 'Lights Burn Dimmer'), stack three loops on house or garage drums, pick the room, then add the tune to your USB and let the folder roll from one track into the next.", "controls": "8 slots (live vocal, three loops, kick, clap, hats, crowd); vocal cut at the gaps or into equal lines, a line order you build, switch, reverse and rotate, vocal isolation and pitch; three stacked loops with their own bar lengths, played as tempo-locked slices or varispeed; grooves (house, two-step, breakbeat, half-time), swing, sidechain pump, sub bass and progression; key and mode; five rooms (bedroom to arena) with crowd; intro, lines, build, drop and outro lengths with auto-arrange; the USB folder: add, load, delete, roll every N bars, make ten; optional Gemini room-to-track.", "how": "Press PLAY: the built-in 'live' vocal comes in, then the loops, a build and a drop. The cards on the left are the vocal's LINES: click one to add it to the ORDER, click a chip in the order to take it out. S switches every line round, V reverses, T rotates. Turn loops on and off on the right. 1 to 5 jump to a section at the next bar, Enter moves on. U adds this tune to the USB folder at the bottom; click a card to play it next; O rolls through the folder, one track every few bars. Drop a live recording into slot 1 and three loops into slots 2 to 4 (press D).", "fonts": "family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;600", "try": ["Find a live recording of a song you love where the voice is easy to hear (a stripped-back session works best), put it in LIVE VOCAL, set the chop to 'at the gaps' and raise ISOLATE until the band thins out. Then press S a few times until the lines say something new in their new order.", "Stack three Splice loops in LOOPS 1 to 3 (a chord loop, a melodic one-shot loop and a texture), set each loop's bars to its real length and leave FIT on 'slices' so they lock to the tempo whatever key or bpm they came in at. Mute two and bring them back one by one in the build.", "Make five tunes with different vocals or orders, press U after each, then turn on ROLL with 16 bars a track and set the room to 'warehouse'. It becomes a set: a folder of things you want to hear in a room with people, which is the whole idea of USB."], "manifesto": {"name": "What would Fred again.. do? USB: an infinite folder, and switching the lines around", "short": "Fred again.., USB", "author": "Fred again.. (Fred Gibson, b. 1993, London), with Jamie T on 'Lights Burn Dimmer'", "year": "2024 to 2025", "where": "USB (2024) and USB002 (2025, released track by track over a ten-week, ten-city tour). He explained the idea on BBC Radio 6 Music's Tape Notes (episode 176), and talked about the Jamie T track there.", "ideas": ["USB is meant to keep growing. Rather than a fixed album, it is an 'infinite' record: new tunes, remixes and edits can be added over time, and USB002 arrived one track at a time during a tour of ten cities in ten weeks.", "Different releases do different jobs. In the same interview he says his Actual Life albums need to feel like honed statements and diary entries, with narrative and cohesion, while USB only has to hold together as things he wants to play in rooms with people. (Paraphrase.)", "On 'Lights Burn Dimmer' he started from Jamie T's song 'Hippodrome', found a live performance where the vocal was easier to isolate, chopped it into pieces and rebuilt the verse in a new order. He says Jamie joked that he then had to learn his own song with every line switched round. (Paraphrase of Tape Notes.)", "Stacking loops is allowed. 'ten', from Ten Days (2024), is built on melodic loops from a commercial sample pack (the pack's maker, Oliver River, described the sound as a sine wave with pitch modulation, noise, tube saturation and reverb). The composition is in the choosing, the order and the arrangement.", "The room is part of the music. His shows mix camera-roll videos with the crowd itself, and the USB tunes are written for that moment of playing to people."], "quotes": [["an infinitely rolling mixtape or folder", "Fred again.., Tape Notes (BBC Radio 6 Music), episode 176"], ["things I want to hear in rooms with people", "Fred again.., Tape Notes (BBC Radio 6 Music), episode 176"]], "system": "Slot 1 is a live vocal. It is cut into LINES at its gaps (or into equal pieces) and the ORDER decides which lines are sung and in what order, so the same words can tell a different story. ISOLATE narrows the vocal to its middle band, the way you might pick a live take where the voice sits apart from the band. Slots 2 to 4 are LOOPS stacked on top of each other; in 'slices' mode each loop is cut into sixteenths and re-triggered on the beat, so it locks to any tempo without changing key; 'varispeed' stretches it like a turntable instead. The drums (kick, clap, hats) play house, two-step garage, breakbeat or half-time patterns, with sidechain pump on the loops and a sine sub following the progression. The arrangement runs INTRO, LINES, BUILD (the vocal tightens to the last line, a riser and a beat of silence), DROP (hook chops of the lines over everything) and OUTRO. The USB is a folder of tunes: each card stores the settings and the line order, and ROLL plays the folder as a set, one track every N bars, with an echo throw between them. The ROOM sets the reverb, tone and crowd.", "gemini": "Describe a room and who is in it; Gemini chooses tempo, groove, room, key, mode and progression, and names the tune."}, "design": {"name": "Karel Martens", "short": "Karel Martens", "who": "Karel Martens (b. 1939, Mook, Netherlands), Dutch graphic designer, typographer and teacher, co-founder of the Werkplaats Typografie in Arnhem (1998)", "era": "1960s to now", "hallmarks": ["Overprinting: transparent inks (often cyan, magenta and yellow) laid over each other so new colours appear where shapes overlap. Here each loop, the drums and the vocal are translucent shapes that multiply where they play together.", "Monoprints on found paper: Martens printed with letterpress and found metal parts onto old library index cards and other found sheets. The vocal lines and the USB tracks here are index cards.", "Simple geometric units (circles, squares, grids) repeated and shifted to make rhythm; a calm grid and plain sans-serif and monospaced type that leave room for colour."], "works": ["'Printed Matter / Drukwerk' (Hyphen Press, 1996; expanded edition 2001)", "Covers for the architecture journal OASE (from 1990)", "His monoprints on found index cards (from the 1990s), and the Werkplaats Typografie"]}, "no": "67", "slug": "usb-folder", "file": "tools/67-usb-folder.html"};</script>

function lofiLoop() { const seq = [[76, 0, 0.7], [72, 0.75, 0.5], [69, 1.5, 1.2], [74, 2.75, 0.8], [72, 3.25, 0.6]], q = 60 / 126; let nz = 0; return mk(BAR, 2, (t, c) => { let s = 0; seq.forEach(([m, at, d]) => { const u = t - at * q; if (u >= 0 && u < d * q * 1.6) s += Math.sin(2 * Math.PI * MM.mtof(m) * (1 + 0.006 * Math.sin(2 * Math.PI * 5.5 * u)) * u) * Math.exp(-u * 2.5) * Math.min(1, u * 200); }); nz += ((Math.random() * 2 - 1) - nz) * 0.2; return Math.tanh((s + nz * 0.05) * 1.8); }); }
function crowdBuf() { let lp = [0, 0], whoo = 0; return mk(6, 2, (t, c) => { lp[c] += ((Math.random() * 2 - 1) - lp[c]) * 0.06; const sw = Math.max(0, Math.sin(t * 0.9 + c) * Math.sin(t * 0.37)); whoo = Math.sin(2 * Math.PI * (420 + 60 * Math.sin(t * 3 + c)) * t) * Math.pow(sw, 6) * 0.25; return lp[c] * (0.7 + 0.3 * Math.sin(t * 1.7 + c)) + whoo; }); }
function liveVocal() { // six sung lines (formant voice) with a little crowd under them: a stand-in for a live recording
  const sr = MM.ctx.sampleRate, V = { a: [730, 1090, 2440], e: [530, 1840, 2480], i: [300, 2250, 3000], o: [570, 840, 2410], u: [320, 900, 2240] };
  const L = [['oaei', [69, 72, 71, 69], 1.2], ['eaoa', [72, 74, 72, 67], 1.1], ['iaoe', [76, 74, 72, 74], 1.3], ['oiau', [69, 67, 64, 67], 1.0], ['aeoi', [72, 76, 79, 76], 1.2], ['uoao', [74, 72, 69, 69], 1.5]];
  let T = 0.15; const segs = L.map(([v, ms, d]) => { const x = { v, ms, a: T, z: T + d }; T += d + 0.3; return x; }); const len = T + 0.2, B = MM.ctx.createBuffer(1, (sr * len) | 0, sr), out = B.getChannelData(0);
  let cr = 0; for (let n = 0; n < out.length; n++) { cr += ((Math.random() * 2 - 1) - cr) * 0.05; out[n] = cr * 0.012; }
  segs.forEach((sg) => { const s0 = [[0, 0], [0, 0], [0, 0]]; let ph = 0; const n0 = (sg.a * sr) | 0, n1 = (sg.z * sr) | 0;
    for (let n = n0; n < n1; n++) { const u = (n - n0) / (n1 - n0), j = Math.min(3, Math.floor(u * 4)), F = V[sg.v[j]], f = MM.mtof(sg.ms[j] - 12) * (1 + 0.012 * Math.sin((n / sr) * 2 * Math.PI * 5.2)); ph += f / sr; const pulse = ph % 1 < 0.08 ? 1 : 0; let y = 0;
      F.forEach((fc, k) => { const r = Math.exp(-Math.PI * (80 + 30 * k) / sr), w = (2 * Math.PI * fc) / sr, s = s0[k], v = pulse + 2 * r * Math.cos(w) * s[0] - r * r * s[1]; s[1] = s[0]; s[0] = v; y += v / (k + 1); });
      out[n] += y * 0.02 * Math.min(1, u * 12) * Math.min(1, (1 - u) * 5); } });
  let pk = 0; for (const x of out) pk = Math.max(pk, Math.abs(x)); for (let i = 0; i < out.length; i++) out[i] *= 0.8 / (pk || 1); return B; }
